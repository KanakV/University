<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎧 Music Emotion Classifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #111 0%, #000 80%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon {
      text-shadow: 0 0 10px #e50914, 0 0 20px #e50914;
    }
    .card-hover:hover {
      transform: scale(1.02);
      transition: transform 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">

  <!-- Header -->
  <header class="w-full py-6 bg-gradient-to-b from-black/80 to-transparent text-center">
    <h1 class="text-5xl font-extrabold neon tracking-wider">MUSIC EMOTION CLASSIFIER</h1>
    <p class="mt-2 text-gray-400 text-sm uppercase">AI-Powered Mood Detection</p>
  </header>

  <!-- Upload Card -->
  <section class="glass rounded-3xl p-8 mt-10 max-w-2xl w-11/12 shadow-lg card-hover">
    <form id="uploadForm" class="flex flex-col items-center space-y-6">
      <input id="audioFile" type="file" accept="audio/*" class="w-full text-black rounded-lg p-2 border border-gray-600">
      <button type="submit" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-xl text-lg font-semibold transition-all duration-300">
        🔍 Analyze Track
      </button>
    </form>
    <div id="result" class="mt-8 text-center"></div>
  </section>

  <!-- Past Analyses Section -->
  <section class="mt-12 max-w-5xl w-11/12">
    <h2 class="text-2xl font-bold mb-4">🎵 Recently Analyzed Tracks</h2>
    <div id="historyContainer" class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
      {% for item in history %}
      <div class="glass p-4 rounded-2xl text-center card-hover">
        <h3 class="text-lg font-semibold text-red-400">{{ item.filename }}</h3>
        <p class="text-sm text-gray-400 mt-1">{{ item.timestamp }}</p>
        <p class="mt-3 text-xl font-bold text-green-400">{{ item.emotion }}</p>
      </div>
      {% endfor %}
    </div>
  </section>

  <script>
    const form = document.getElementById("uploadForm");
    const resultDiv = document.getElementById("result");
    const historyContainer = document.getElementById("historyContainer");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("audioFile");
      if (!fileInput.files.length) {
        alert("Please upload a music file first.");
        return;
      }

      resultDiv.innerHTML = "<p class='text-gray-400 animate-pulse'>Analyzing your track...</p>";
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const res = await fetch("/analyze/", { method: "POST", body: formData });
      const data = await res.json();

      if (data.error) {
        resultDiv.innerHTML = `<p class='text-red-500'>Error: ${data.error}</p>`;
      } else {
        const topMood = data.emotion;
        const timestamp = data.timestamp;
        const scores = data.scores;

        resultDiv.innerHTML = `
          <div class="glass p-6 rounded-2xl mt-4 inline-block text-left">
            <p class='text-2xl font-bold text-green-400 mb-2'>Mood: ${topMood}</p>
            <p class='text-sm text-gray-400 mb-4'>(${timestamp})</p>
            <div class="space-y-1">
              ${Object.entries(scores)
                .map(([emo, score]) =>
                  `<p class="text-gray-300">${emo}: <span class="text-blue-400">${score}</span></p>`
                )
                .join("")}
            </div>
          </div>
        `;

        // Add to history
        const newCard = document.createElement("div");
        newCard.className = "glass p-4 rounded-2xl text-center card-hover";
        newCard.innerHTML = `
          <h3 class="text-lg font-semibold text-red-400">${fileInput.files[0].name}</h3>
          <p class="text-sm text-gray-400 mt-1">${timestamp}</p>
          <p class="mt-3 text-xl font-bold text-green-400">${topMood}</p>
        `;
        historyContainer.prepend(newCard);
      }
    });
  </script>

</body>
</html>
